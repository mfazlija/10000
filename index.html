<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jeu du 10 000</title>
    
    <!-- Tailwind CSS & FontAwesome -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    
    <!-- React -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    
    <!-- Babel v7 -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <!-- Firebase -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['"Plus Jakarta Sans"', 'sans-serif'],
                    },
                    colors: {
                        brand: {
                            bg: '#f4f2fb',
                            teal: '#00c3a5',
                            tealDark: '#00a38b',
                            indigo: '#3b52f6',
                            indigoDark: '#2a3ecb',
                            lavender: '#e8e3f9',
                            dark: '#1e1a4b',
                        }
                    }
                }
            }
        }
    </script>

    <style>
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: #f4f2fb;
            background-image: radial-gradient(#d3cbe8 1px, transparent 1px);
            background-size: 24px 24px;
        }
    </style>
</head>
<body class="text-slate-800 antialiased min-h-screen">

    <!-- Anti-Écran Bleu : S'affiche uniquement si le code plante totalement -->
    <div id="fallback-error" class="hidden text-center p-8 mt-10 text-red-500 font-mono bg-white rounded-2xl max-w-lg mx-auto border border-red-200 shadow-2xl">
        <i class="fas fa-bug text-4xl mb-4"></i>
        <h2 class="text-xl font-bold mb-2">Erreur système fatale</h2>
        <p id="fallback-error-msg" class="text-sm text-slate-600 break-words bg-slate-50 p-4 rounded-xl border border-slate-200"></p>
        <p class="mt-4 text-xs text-slate-400">Le jeu n'a pas pu démarrer. Copie l'erreur ci-dessus à l'IA.</p>
    </div>

    <div id="root"></div>

    <script>
        window.addEventListener('error', function(e) {
            document.getElementById('fallback-error').classList.remove('hidden');
            document.getElementById('fallback-error-msg').innerText = e.message || "Erreur inconnue";
        });
    </script>

    <script type="text/babel">
        const { useState, useEffect } = React;

        const firebaseConfig = {
            apiKey: "AIzaSyCDJzVPNhyNdU95WTbZ2hTnCV_U6tFeExk",
            authDomain: "project-688816839048633365.firebaseapp.com",
            projectId: "project-688816839048633365",
            storageBucket: "project-688816839048633365.firebasestorage.app",
            messagingSenderId: "57106076475",
            appId: "1:57106076475:web:82c33baaefade575a55d1e"
        };

        const DiceIcon = ({ value, selected }) => {
            const dotClass = selected ? "fill-white" : "fill-indigo-950";
            const dots = {
                1: [<circle key="1" cx="50" cy="50" r="10" className={dotClass} />],
                2: [<circle key="1" cx="25" cy="25" r="10" className={dotClass} />, <circle key="2" cx="75" cy="75" r="10" className={dotClass} />],
                3: [<circle key="1" cx="25" cy="25" r="10" className={dotClass} />, <circle key="2" cx="50" cy="50" r="10" className={dotClass} />, <circle key="3" cx="75" cy="75" r="10" className={dotClass} />],
                4: [<circle key="1" cx="25" cy="25" r="10" className={dotClass} />, <circle key="2" cx="75" cy="25" r="10" className={dotClass} />, <circle key="3" cx="25" cy="75" r="10" className={dotClass} />, <circle key="4" cx="75" cy="75" r="10" className={dotClass} />],
                5: [<circle key="1" cx="25" cy="25" r="10" className={dotClass} />, <circle key="2" cx="75" cy="25" r="10" className={dotClass} />, <circle key="3" cx="50" cy="50" r="10" className={dotClass} />, <circle key="4" cx="25" cy="75" r="10" className={dotClass} />, <circle key="5" cx="75" cy="75" r="10" className={dotClass} />],
                6: [<circle key="1" cx="25" cy="20" r="10" className={dotClass} />, <circle key="2" cx="75" cy="20" r="10" className={dotClass} />, <circle key="3" cx="25" cy="50" r="10" className={dotClass} />, <circle key="4" cx="75" cy="50" r="10" className={dotClass} />, <circle key="5" cx="25" cy="80" r="10" className={dotClass} />, <circle key="6" cx="75" cy="80" r="10" className={dotClass} />]
            };
            return <svg viewBox="0 0 100 100" className="w-12 h-12 md:w-16 md:h-16">{dots[value]}</svg>;
        };

        function App() {
            const [gameState, setGameState] = useState(null);
            const [loading, setLoading] = useState(true);
            const [errorMsg, setErrorMsg] = useState(null);
            const [myPlayerId, setMyPlayerId] = useState(localStorage.getItem('10000_playerId') || null);
            const [showHistory, setShowHistory] = useState(false);

            useEffect(() => {
                let unsubscribeDb = () => {};
                let unsubscribeAuth = () => {};

                try {
                    if (!firebase.apps.length) {
                        firebase.initializeApp(firebaseConfig);
                    }
                    const db = firebase.firestore();
                    const auth = firebase.auth();

                    auth.signInAnonymously().catch(error => {
                        setErrorMsg("Erreur d'authentification : " + error.message);
                        setLoading(false);
                    });

                    unsubscribeAuth = auth.onAuthStateChanged((user) => {
                        if (user) {
                            const docRef = db.collection("games").doc("shared_room");
                            unsubscribeDb = docRef.onSnapshot((docSnap) => {
                                if (docSnap.exists) {
                                    setGameState(docSnap.data());
                                    setLoading(false);
                                } else {
                                    docRef.set({
                                        players: {
                                            p1: { name: "Joueur 1", score: 0, history: [0], active: false, strikes: 0 },
                                            p2: { name: "Joueur 2", score: 0, history: [0], active: false, strikes: 0 }
                                        },
                                        turn: 'p1',
                                        dices: [],
                                        savedDices: [],
                                        currentTurnScore: 0,
                                        rollCount: 0,
                                        message: "La partie est prête !",
                                        bustedPending: null,
                                        potAvailable: null
                                    }).catch(e => {
                                        setErrorMsg("Erreur d'écriture de la table : " + e.message);
                                        setLoading(false);
                                    });
                                }
                            }, (error) => {
                                console.error("Erreur Firestore :", error);
                                setErrorMsg("Erreur Firebase : " + error.message);
                                setLoading(false);
                            });
                        }
                    });

                } catch (error) {
                    setErrorMsg("Erreur d'initialisation : " + error.message);
                    setLoading(false);
                }

                return () => {
                    unsubscribeDb();
                    unsubscribeAuth();
                };
            }, []);

            const updateGame = async (newState) => {
                try {
                    const db = firebase.firestore();
                    await db.collection("games").doc("shared_room").set({ ...gameState, ...newState });
                } catch (error) {
                    console.error("Erreur de mise à jour:", error);
                }
            };

            const joinGame = (playerId) => {
                localStorage.setItem('10000_playerId', playerId);
                setMyPlayerId(playerId);
                updateGame({ players: { ...gameState.players, [playerId]: { ...gameState.players[playerId], active: true } } });
            };

            const leaveGame = () => {
                localStorage.removeItem('10000_playerId');
                updateGame({ players: { ...gameState.players, [myPlayerId]: { ...gameState.players[myPlayerId], active: false } } });
                setMyPlayerId(null);
            };

            const resetTable = () => {
                localStorage.removeItem('10000_playerId');
                updateGame({
                    players: {
                        p1: { name: "Joueur 1", score: 0, history: [0], active: false, strikes: 0 },
                        p2: { name: "Joueur 2", score: 0, history: [0], active: false, strikes: 0 }
                    },
                    turn: 'p1',
                    dices: [],
                    savedDices: [],
                    currentTurnScore: 0,
                    rollCount: 0,
                    message: "Table réinitialisée.",
                    bustedPending: null,
                    potAvailable: null
                });
                setMyPlayerId(null);
            };

            const generateAndEvaluateDices = (dicesToRoll) => {
                let newDices = [];
                for (let i = 0; i < dicesToRoll; i++) {
                    newDices.push({ id: Math.random(), value: Math.floor(Math.random() * 6) + 1, selected: false });
                }

                const counts = {};
                newDices.forEach(d => counts[d.value] = (counts[d.value] || 0) + 1);
                
                let isStraight = false;
                let isFull = false;
                if (dicesToRoll === 5) {
                    const values = Object.values(counts);
                    if (values.includes(3) && values.includes(2)) isFull = true;
                    if (values.length === 5) {
                        const sorted = Object.keys(counts).sort().join('');
                        if (sorted === '12345' || sorted === '23456') isStraight = true;
                    }
                }

                let hasPoints = false;
                newDices.forEach(d => {
                    if (isStraight || isFull) {
                        d.selected = true;
                        hasPoints = true;
                    } 
                    else if (d.value === 1 || d.value === 5 || counts[d.value] >= 3) {
                        d.selected = true;
                        hasPoints = true;
                    }
                });

                return { newDices, hasPoints };
            };

            const rollDices = () => {
                const { newDices, hasPoints } = generateAndEvaluateDices(5 - gameState.savedDices.length);
                const isFirstRollOfTurn = gameState.rollCount === 0;

                if (!hasPoints) {
                    let currentStrikes = gameState.players[gameState.turn].strikes;
                    currentStrikes += isFirstRollOfTurn ? 2 : 1;
                    
                    let newScore = gameState.players[gameState.turn].score;
                    let newHistory = [...gameState.players[gameState.turn].history];
                    let msg = isFirstRollOfTurn 
                        ? `Chou-blanc au 1er lancer ! Double coche. (${currentStrikes}/3)`
                        : `Chou-blanc ! Coche ajoutée. (${currentStrikes}/3)`;

                    if (currentStrikes >= 3) {
                        newHistory.pop();
                        newScore = newHistory.length > 0 ? newHistory[newHistory.length - 1] : 0;
                        if (newHistory.length === 0) newHistory = [0];
                        currentStrikes = 0;
                        msg = "3ème coche ! Retour au score précédent.";
                    }

                    newDices.forEach(d => { d.busted = true; d.selected = false; });

                    updateGame({
                        dices: newDices,
                        rollCount: gameState.rollCount + 1,
                        message: msg,
                        potAvailable: null,
                        bustedPending: {
                            turn: gameState.turn === 'p1' ? 'p2' : 'p1',
                            players: {
                                ...gameState.players,
                                [gameState.turn]: { ...gameState.players[gameState.turn], score: newScore, history: newHistory, strikes: currentStrikes }
                            }
                        }
                    });
                } else {
                    updateGame({ dices: newDices, rollCount: gameState.rollCount + 1, message: "Points détectés ! Relancez ou Gardez.", potAvailable: null });
                }
            };

            const takePot = () => {
                const pot = gameState.potAvailable;
                const dummySaved = Array(5 - pot.diceLeft).fill({ id: Math.random(), dummy: true });
                
                const { newDices, hasPoints } = generateAndEvaluateDices(pot.diceLeft);

                if (!hasPoints) {
                    let currentStrikes = gameState.players[gameState.turn].strikes + 1;
                    let newScore = gameState.players[gameState.turn].score;
                    let newHistory = [...gameState.players[gameState.turn].history];
                    let msg = `Reprise ratée (Chou-blanc) ! Coche ajoutée. (${currentStrikes}/3)`;

                    if (currentStrikes >= 3) {
                        newHistory.pop();
                        newScore = newHistory.length > 0 ? newHistory[newHistory.length - 1] : 0;
                        if (newHistory.length === 0) newHistory = [0];
                        currentStrikes = 0;
                        msg = "3ème coche ! Retour au score précédent.";
                    }

                    newDices.forEach(d => { d.busted = true; d.selected = false; });

                    updateGame({
                        savedDices: dummySaved,
                        dices: newDices,
                        currentTurnScore: pot.score,
                        rollCount: 1,
                        potAvailable: null,
                        message: msg,
                        bustedPending: {
                            turn: gameState.turn === 'p1' ? 'p2' : 'p1',
                            players: {
                                ...gameState.players,
                                [gameState.turn]: { ...gameState.players[gameState.turn], score: newScore, history: newHistory, strikes: currentStrikes }
                            }
                        }
                    });
                } else {
                    updateGame({
                        savedDices: dummySaved,
                        dices: newDices,
                        currentTurnScore: pot.score,
                        rollCount: 1,
                        potAvailable: null,
                        message: `Suite reprise avec succès ! Relancez ou Gardez.`
                    });
                }
            };

            const tradeFivesForOne = () => {
                let found = 0;
                const newDices = [];
                
                gameState.dices.forEach(d => {
                    if (d.value === 5 && d.selected && !d.busted && found < 2) {
                        found++;
                        if (found === 1) {
                            newDices.push({ ...d, value: 1 });
                        }
                    } else {
                        newDices.push(d);
                    }
                });
                
                updateGame({ dices: newDices, message: "Deux 🎲5 fusionnés en un 🎲1 ! (Dé libéré pour la relance)" });
            };

            const calculateSelection = () => {
                const selected = gameState.dices.filter(d => d.selected);
                if (selected.length === 0) return { valid: false, score: 0, isFull: false, isStraight: false };

                const counts = {};
                selected.forEach(d => counts[d.value] = (counts[d.value] || 0) + 1);
                
                if (selected.length === 5) {
                    const values = Object.values(counts);
                    if (values.includes(3) && values.includes(2)) {
                        return { valid: true, score: 1500, isFull: true, isStraight: false };
                    }
                    if (values.length === 5) {
                        const sorted = Object.keys(counts).sort().join('');
                        if (sorted === '12345' || sorted === '23456') {
                            return { valid: true, score: 1500, isFull: false, isStraight: true };
                        }
                    }
                }

                let score = 0;
                let valid = true;

                for (const [valStr, count] of Object.entries(counts)) {
                    const val = parseInt(valStr);
                    if (count >= 3) {
                        score += val === 1 ? 1000 * Math.pow(2, count - 3) : (val * 100) * Math.pow(2, count - 3);
                    } else if (val === 1) score += count * 100;
                    else if (val === 5) score += count * 50;
                    else valid = false;
                }
                return { valid, score, isFull: false, isStraight: false };
            };

            const saveSelection = () => {
                const { score } = calculateSelection();
                const newSaved = [...gameState.savedDices, ...gameState.dices.filter(d => d.selected)];
                const newTurnScore = gameState.currentTurnScore + score;
                
                if (newSaved.length === 5) {
                    updateGame({ savedDices: [], dices: [], currentTurnScore: newTurnScore, message: "Main pleine ! Relancez 5 dés." });
                } else {
                    const { newDices, hasPoints } = generateAndEvaluateDices(5 - newSaved.length);

                    if (!hasPoints) {
                        let currentStrikes = gameState.players[gameState.turn].strikes + 1;
                        let newScore = gameState.players[gameState.turn].score;
                        let newHistory = [...gameState.players[gameState.turn].history];
                        let msg = `Chou-blanc ! Coche ajoutée. (${currentStrikes}/3)`;

                        if (currentStrikes >= 3) {
                            newHistory.pop();
                            newScore = newHistory.length > 0 ? newHistory[newHistory.length - 1] : 0;
                            if (newHistory.length === 0) newHistory = [0];
                            currentStrikes = 0;
                            msg = "3ème coche ! Retour au score précédent.";
                        }

                        newDices.forEach(d => { d.busted = true; d.selected = false; });

                        updateGame({
                            savedDices: newSaved,
                            dices: newDices,
                            currentTurnScore: newTurnScore,
                            rollCount: gameState.rollCount + 1,
                            message: msg,
                            potAvailable: null,
                            bustedPending: {
                                turn: gameState.turn === 'p1' ? 'p2' : 'p1',
                                players: {
                                    ...gameState.players,
                                    [gameState.turn]: { ...gameState.players[gameState.turn], score: newScore, history: newHistory, strikes: currentStrikes }
                                }
                            }
                        });
                    } else {
                        updateGame({ 
                            savedDices: newSaved, 
                            dices: newDices, 
                            currentTurnScore: newTurnScore, 
                            rollCount: gameState.rollCount + 1, 
                            message: "Points détectés ! Relancez ou Gardez." 
                        });
                    }
                }
            };

            const bankPoints = () => {
                const totalTurnScore = gameState.currentTurnScore + (calculateSelection().valid ? calculateSelection().score : 0);
                const currentPlayer = gameState.players[gameState.turn];
                const otherPlayerId = gameState.turn === 'p1' ? 'p2' : 'p1';
                const otherPlayer = gameState.players[otherPlayerId];

                if (currentPlayer.score === 0 && totalTurnScore < 500) {
                    const newDices = gameState.dices.map(d => ({...d, busted: true, selected: false}));
                    updateGame({ 
                        dices: newDices,
                        message: `Ouverture ratée (Il faut 500 min). Tour passé.`,
                        potAvailable: null,
                        bustedPending: {
                            turn: otherPlayerId,
                            players: gameState.players
                        }
                    });
                    return;
                }

                const newScore = currentPlayer.score + totalTurnScore;
                
                if (newScore > 10000) {
                    let currentStrikes = currentPlayer.strikes + 1;
                    let finalScore = currentPlayer.score;
                    let finalHistory = [...currentPlayer.history];
                    let msg = `Dépassement (10 000 max) ! Coche ajoutée. (${currentStrikes}/3)`;

                    if (currentStrikes >= 3) {
                        finalHistory.pop();
                        finalScore = finalHistory.length > 0 ? finalHistory[finalHistory.length - 1] : 0;
                        if (finalHistory.length === 0) finalHistory = [0];
                        currentStrikes = 0;
                        msg = `Dépassement ET 3ème coche ! Retour au score précédent.`;
                    }

                    const newDices = gameState.dices.map(d => ({...d, busted: true, selected: false}));
                    updateGame({
                        dices: newDices,
                        message: msg,
                        potAvailable: null,
                        bustedPending: {
                            turn: otherPlayerId,
                            players: {
                                ...gameState.players,
                                [gameState.turn]: { ...currentPlayer, score: finalScore, history: finalHistory, strikes: currentStrikes }
                            }
                        }
                    });
                    return;
                } else if (newScore === 10000) {
                    updateGame({
                        players: {
                            ...gameState.players,
                            [gameState.turn]: { ...currentPlayer, score: newScore, history: [...currentPlayer.history, newScore], strikes: 0 }
                        },
                        turn: 'end',
                        message: `🏆 VICTOIRE INCROYABLE ! ${currentPlayer.name} a atteint exactement 10 000 points !`,
                        potAvailable: null, dices: [], savedDices: [], currentTurnScore: 0, rollCount: 0
                    });
                    return;
                }

                let otherPlayerScore = otherPlayer.score;
                let otherPlayerHistory = [...otherPlayer.history];
                let msg = `${currentPlayer.name} garde ${totalTurnScore} pts.`;

                if (newScore === otherPlayerScore && newScore > 0) {
                    otherPlayerHistory.pop();
                    otherPlayerScore = otherPlayerHistory.length > 0 ? otherPlayerHistory[otherPlayerHistory.length - 1] : 0;
                    if (otherPlayerHistory.length === 0) otherPlayerHistory = [0];
                    msg = `💥 COLLISION ! ${otherPlayer.name} a été tracé et redescend à ${otherPlayerScore} pts !`;
                }

                const selectedCount = gameState.dices.filter(d => d.selected && !d.busted).length;
                const diceLeft = 5 - (gameState.savedDices.length + selectedCount);
                let pot = null;
                if (diceLeft > 0) {
                    pot = { score: totalTurnScore, diceLeft: diceLeft };
                }

                updateGame({
                    players: {
                        ...gameState.players,
                        [gameState.turn]: { ...currentPlayer, score: newScore, history: [...currentPlayer.history, newScore], strikes: 0 },
                        [otherPlayerId]: { ...otherPlayer, score: otherPlayerScore, history: otherPlayerHistory }
                    },
                    turn: otherPlayerId, dices: [], savedDices: [], currentTurnScore: 0, rollCount: 0, message: msg, potAvailable: pot
                });
            };

            const acknowledgeBust = () => {
                updateGame({
                    players: gameState.bustedPending.players,
                    turn: gameState.bustedPending.turn,
                    dices: [],
                    savedDices: [],
                    currentTurnScore: 0,
                    rollCount: 0,
                    bustedPending: null,
                    potAvailable: null,
                    message: "C'est à votre tour !"
                });
            };

            if (errorMsg) {
                return (
                    <div className="min-h-screen flex flex-col items-center justify-center p-6 text-center">
                        <div className="bg-white rounded-3xl p-8 max-w-md shadow-xl border border-red-100">
                            <div className="w-16 h-16 bg-red-50 text-red-500 rounded-2xl flex items-center justify-center text-3xl mx-auto mb-4">
                                <i className="fas fa-exclamation-triangle"></i>
                            </div>
                            <h1 className="text-2xl font-extrabold text-slate-900 mb-2">Erreur</h1>
                            <p className="text-slate-600 bg-slate-50 p-4 rounded-xl mb-6 font-mono text-xs break-words border border-slate-200">
                                {errorMsg}
                            </p>
                        </div>
                    </div>
                );
            }

            if (loading || !gameState) return (
                <div className="min-h-screen flex flex-col items-center justify-center text-slate-500">
                    <div className="w-16 h-16 bg-brand-teal/10 text-brand-teal rounded-3xl flex items-center justify-center text-2xl mb-4 animate-bounce">
                        <i className="fas fa-dice"></i>
                    </div>
                    <p className="text-sm font-semibold tracking-wide text-brand-dark animate-pulse">Chargement de la table...</p>
                </div>
            );

            if (!myPlayerId) {
                return (
                    <div className="min-h-screen flex flex-col items-center justify-center p-6 max-w-md mx-auto text-center">
                        <div className="w-20 h-20 bg-indigo-600 text-white rounded-3xl flex items-center justify-center text-4xl shadow-xl shadow-indigo-200 mb-6">
                            🎲
                        </div>
                        <span className="px-4 py-1.5 bg-brand-teal/10 text-brand-tealDark font-extrabold text-xs tracking-wider uppercase rounded-full mb-3">
                            Multijoueur Temps Réel
                        </span>
                        <h1 className="text-3xl font-extrabold text-brand-dark mb-3">Le Jeu du 10 000</h1>
                        <p className="mb-8 text-slate-500 text-sm leading-relaxed">
                            Partagez le lien avec votre adversaire et sélectionnez votre position à la table pour commencer :
                        </p>
                        <div className="flex flex-col sm:flex-row gap-4 w-full">
                            <button 
                                onClick={() => joinGame('p1')} 
                                disabled={gameState.players.p1.active} 
                                className={`flex-1 py-4 px-6 rounded-2xl font-bold text-base transition-all shadow-lg ${gameState.players.p1.active ? 'bg-slate-200 text-slate-400 cursor-not-allowed shadow-none' : 'bg-brand-indigo hover:bg-brand-indigoDark text-white shadow-indigo-200 active:scale-95'}`}
                            >
                                {gameState.players.p1.active ? 'Joueur 1 (Occupé)' : 'Prendre la place 1'}
                            </button>
                            <button 
                                onClick={() => joinGame('p2')} 
                                disabled={gameState.players.p2.active} 
                                className={`flex-1 py-4 px-6 rounded-2xl font-bold text-base transition-all shadow-lg ${gameState.players.p2.active ? 'bg-slate-200 text-slate-400 cursor-not-allowed shadow-none' : 'bg-brand-teal hover:bg-brand-tealDark text-white shadow-teal-200 active:scale-95'}`}
                            >
                                {gameState.players.p2.active ? 'Joueur 2 (Occupé)' : 'Prendre la place 2'}
                            </button>
                        </div>
                        <button onClick={resetTable} className="mt-12 text-rose-500 text-xs font-semibold hover:underline">
                            Réinitialiser la table (Libérer les places)
                        </button>
                    </div>
                );
            }

            const isMyTurn = gameState.turn === myPlayerId;
            const { valid, score, isFull, isStraight } = calculateSelection();
            const totalPending = gameState.currentTurnScore + (valid ? score : 0);
            const isEndingIn50 = totalPending % 100 === 50 && totalPending > 0;

            const count5s = gameState.dices ? gameState.dices.filter(d => d.value === 5 && d.selected && !d.busted).length : 0;
            const canTradeFives = count5s === 2 && !isFull && !isStraight;

            const allDicesScoring = gameState.dices && gameState.dices.length > 0 && gameState.dices.every(d => d.selected && !d.busted);

            const myScore = gameState.players[myPlayerId].score;
            const isOpeningPhase = myScore === 0;
            const needsMorePointsToOpen = isOpeningPhase && totalPending > 0 && totalPending < 500;

            const p1Data = gameState.bustedPending ? gameState.bustedPending.players.p1 : gameState.players.p1;
            const p2Data = gameState.bustedPending ? gameState.bustedPending.players.p2 : gameState.players.p2;

            const renderStrikes = (strikes) => (
                <div className="flex gap-1.5 mt-2 justify-center">
                    <div className={`w-2.5 h-2.5 rounded-full transition-colors ${strikes >= 1 ? 'bg-rose-500 shadow-sm shadow-rose-200' : 'bg-slate-200'}`}></div>
                    <div className={`w-2.5 h-2.5 rounded-full transition-colors ${strikes >= 2 ? 'bg-rose-500 shadow-sm shadow-rose-200' : 'bg-slate-200'}`}></div>
                    <div className={`w-2.5 h-2.5 rounded-full transition-colors ${strikes >= 3 ? 'bg-rose-500 shadow-sm shadow-rose-200' : 'bg-slate-200'}`}></div>
                </div>
            );

            if (gameState.turn === 'end') {
                return (
                    <div className="min-h-screen flex flex-col items-center justify-center p-6 text-center">
                        <div className="bg-white rounded-3xl p-10 max-w-lg shadow-2xl border border-indigo-100 flex flex-col items-center">
                            <div className="w-24 h-20 bg-amber-50 text-amber-500 rounded-3xl flex items-center justify-center text-5xl mb-6 shadow-inner animate-bounce">
                                🏆
                            </div>
                            <h1 className="text-3xl font-black text-brand-dark mb-3">{gameState.message}</h1>
                            <p className="text-slate-500 text-sm mb-8">Partie terminée avec succès !</p>
                            <button onClick={resetTable} className="px-8 py-4 bg-brand-teal hover:bg-brand-tealDark text-white font-bold rounded-2xl shadow-lg shadow-teal-200 transition-all active:scale-95">
                                Lancer une nouvelle partie
                            </button>
                        </div>
                    </div>
                );
            }

            return (
                <div className="min-h-screen flex flex-col p-4 md:p-8 max-w-4xl mx-auto">
                    
                    {/* History Modal */}
                    {showHistory && (
                        <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-brand-dark/40 backdrop-blur-md transition-all">
                            <div className="bg-white rounded-3xl shadow-2xl border border-slate-100 w-full max-w-2xl max-h-[85vh] flex flex-col overflow-hidden animate-in fade-in zoom-in-95 duration-200">
                                <div className="p-6 border-b border-slate-100 flex justify-between items-center bg-slate-50/50">
                                    <div className="flex items-center gap-3">
                                        <div className="w-10 h-10 bg-indigo-50 text-indigo-600 rounded-2xl flex items-center justify-center font-bold">
                                            <i className="fas fa-clock-rotate-left"></i>
                                        </div>
                                        <div>
                                            <h2 className="text-lg font-extrabold text-brand-dark">Historique & Paliers</h2>
                                            <p className="text-xs text-slate-400">Progression détaillée de la partie</p>
                                        </div>
                                    </div>
                                    <button onClick={() => setShowHistory(false)} className="w-10 h-10 rounded-2xl bg-slate-100 hover:bg-slate-200 text-slate-500 flex items-center justify-center font-bold text-xl transition-colors">&times;</button>
                                </div>
                                <div className="flex-1 overflow-y-auto p-6 flex flex-col md:flex-row gap-6">
                                    <div className="flex-1 bg-slate-50 rounded-2xl p-5 border border-slate-100">
                                        <div className="text-center mb-4 pb-3 border-b border-slate-200/60">
                                            <h3 className="text-indigo-600 font-extrabold text-base">{p1Data.name}</h3>
                                            <div className="text-xs text-slate-400 mt-1">Coches actuelles : <span className="text-rose-500 font-extrabold">{p1Data.strikes}/3</span></div>
                                        </div>
                                        <ul className="space-y-2 text-sm font-mono">
                                            {p1Data.history.map((score, idx) => (
                                                <li key={idx} className="flex justify-between items-center py-2 px-3 bg-white rounded-xl border border-slate-100 shadow-sm">
                                                    <span className="text-slate-400 text-xs font-sans font-medium">Palier {idx}</span>
                                                    <span className="font-extrabold text-brand-dark">{score} <span className="text-xs text-slate-400 font-normal">pts</span></span>
                                                </li>
                                            ))}
                                        </ul>
                                    </div>
                                    <div className="flex-1 bg-slate-50 rounded-2xl p-5 border border-slate-100">
                                        <div className="text-center mb-4 pb-3 border-b border-slate-200/60">
                                            <h3 className="text-teal-600 font-extrabold text-base">{p2Data.name}</h3>
                                            <div className="text-xs text-slate-400 mt-1">Coches actuelles : <span className="text-rose-500 font-extrabold">{p2Data.strikes}/3</span></div>
                                        </div>
                                        <ul className="space-y-2 text-sm font-mono">
                                            {p2Data.history.map((score, idx) => (
                                                <li key={idx} className="flex justify-between items-center py-2 px-3 bg-white rounded-xl border border-slate-100 shadow-sm">
                                                    <span className="text-slate-400 text-xs font-sans font-medium">Palier {idx}</span>
                                                    <span className="font-extrabold text-brand-dark">{score} <span className="text-xs text-slate-400 font-normal">pts</span></span>
                                                </li>
                                            ))}
                                        </ul>
                                    </div>
                                </div>
                                <div className="p-4 border-t border-slate-100 text-center bg-slate-50/50">
                                    <button onClick={() => setShowHistory(false)} className="px-6 py-2.5 bg-slate-800 hover:bg-slate-700 text-white text-xs font-bold rounded-xl transition-colors">
                                        Fermer
                                    </button>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* Top Scoreboard Card */}
                    <div className="relative flex justify-between items-center mb-8 p-6 bg-white/90 backdrop-blur-md rounded-3xl shadow-xl shadow-indigo-100/50 border border-white">
                        
                        <button onClick={() => setShowHistory(true)} className="absolute -top-3 -right-3 w-11 h-10 bg-indigo-600 hover:bg-indigo-700 text-white rounded-2xl flex items-center justify-center transition-colors shadow-lg shadow-indigo-200 z-10" title="Voir l'historique">
                            <i className="fas fa-clock-rotate-left"></i>
                        </button>

                        <div className={`flex-1 text-center transition-all p-3 rounded-2xl ${gameState.turn === 'p1' ? 'bg-indigo-50/60 border border-indigo-100 opacity-100' : 'opacity-40'}`}>
                            <span className="text-xs font-bold uppercase tracking-wider text-indigo-500 block mb-0.5">
                                {myPlayerId === 'p1' ? 'Vous (Joueur 1)' : 'Joueur 1'}
                            </span>
                            <div className="text-3xl font-black text-brand-dark tracking-tight">{gameState.players.p1.score} <span className="text-xs font-semibold text-slate-400">pts</span></div>
                            {renderStrikes(p1Data.strikes)}
                        </div>

                        <div className="px-4 text-slate-300 font-bold text-lg">VS</div>

                        <div className={`flex-1 text-center transition-all p-3 rounded-2xl ${gameState.turn === 'p2' ? 'bg-teal-50/60 border border-teal-100 opacity-100' : 'opacity-40'}`}>
                            <span className="text-xs font-bold uppercase tracking-wider text-teal-600 block mb-0.5">
                                {myPlayerId === 'p2' ? 'Vous (Joueur 2)' : 'Joueur 2'}
                            </span>
                            <div className="text-3xl font-black text-brand-dark tracking-tight">{gameState.players.p2.score} <span className="text-xs font-semibold text-slate-400">pts</span></div>
                            {renderStrikes(p2Data.strikes)}
                        </div>
                    </div>

                    {/* Game Message Status Tag */}
                    <div className="text-center mb-8 min-h-[32px] flex items-center justify-center">
                        <span className="inline-flex items-center gap-2 px-4 py-1.5 bg-white border border-indigo-100 rounded-full text-xs font-bold text-indigo-900 shadow-sm">
                            <span className="w-2 h-2 rounded-full bg-brand-teal animate-ping"></span>
                            {gameState.message}
                        </span>
                    </div>

                    {/* Interactive Play Arena */}
                    <div className="flex-1 flex flex-col items-center justify-center">
                        {!isMyTurn && gameState.dices.length > 0 && !gameState.bustedPending && (
                            <p className="text-slate-400 text-xs font-semibold mb-6 animate-pulse bg-white/60 px-4 py-1.5 rounded-full border border-slate-100">
                                <i className="fas fa-hourglass-half mr-2 text-indigo-400"></i>Votre adversaire réfléchit...
                            </p>
                        )}
                        {!isMyTurn && gameState.bustedPending && (
                            <p className="text-rose-500 text-xs font-bold mb-6 bg-rose-50 px-4 py-1.5 rounded-full border border-rose-100">
                                Votre adversaire a perdu son tour.
                            </p>
                        )}
                        
                        {/* Dice Display Container */}
                        <div className="relative flex flex-wrap justify-center gap-4 mb-8 min-h-[100px] w-full max-w-lg items-center">
                            {gameState.dices.map((dice) => (
                                <div 
                                    key={dice.id} 
                                    className={`relative p-3 md:p-4 rounded-3xl transition-all duration-300 ${
                                        dice.selected && !dice.busted 
                                            ? 'bg-brand-teal text-white shadow-xl shadow-teal-200 scale-105 -translate-y-1.5 ring-4 ring-teal-100' 
                                            : 'bg-white text-slate-800 border-2 border-slate-100 shadow-md shadow-slate-100'
                                    }`}
                                >
                                    <DiceIcon value={dice.value} selected={dice.selected && !dice.busted} />
                                </div>
                            ))}
                            
                            {/* Busted Overlay */}
                            {gameState.bustedPending && (
                                <div className="absolute inset-0 flex items-center justify-center pointer-events-none z-10">
                                    <i className="fas fa-xmark text-rose-500/30 drop-shadow-xl" style={{ fontSize: '14rem' }}></i>
                                </div>
                            )}
                        </div>

                        {/* Selection Score Feedback */}
                        {gameState.dices.length > 0 && !gameState.bustedPending && (
                            <div className={`px-5 py-2 rounded-2xl font-extrabold text-xs mb-6 shadow-sm border transition-colors ${valid ? 'bg-teal-50 border-teal-200 text-teal-700' : 'bg-rose-50 border-rose-200 text-rose-600'}`}>
                                {valid ? `✨ Sélection automatique : +${score} pts` : 'Aucun point'}
                            </div>
                        )}
                        
                        {gameState.bustedPending && (
                            <div className="px-5 py-2 rounded-2xl font-extrabold text-xs mb-6 bg-rose-50 border border-rose-200 text-rose-600 shadow-sm">
                                ❌ Perdu pour ce tour !
                            </div>
                        )}

                        <div className="text-sm font-semibold text-slate-400 mb-8 bg-white/70 px-6 py-2.5 rounded-2xl border border-slate-100 shadow-sm">
                            Total en cours : <span className="font-extrabold text-brand-dark text-lg ml-1">{totalPending}</span> <span className="text-xs font-normal">pts</span>
                        </div>

                        {/* Action Control Buttons */}
                        {isMyTurn && (
                            <div className="flex flex-wrap justify-center gap-3 w-full max-w-md">
                                {gameState.bustedPending ? (
                                    <button onClick={acknowledgeBust} className="w-full py-4 bg-rose-500 hover:bg-rose-600 text-white font-extrabold text-sm rounded-2xl shadow-lg shadow-rose-200 transition-all active:scale-95">
                                        Passer le tour
                                    </button>
                                ) : gameState.dices.length === 0 ? (
                                    gameState.potAvailable ? (
                                        <div className="flex flex-col gap-3 w-full text-center bg-white p-5 rounded-3xl border border-indigo-100 shadow-xl shadow-indigo-100/40">
                                            <p className="text-indigo-600 font-extrabold text-xs tracking-wider uppercase">
                                                🔥 Opportunité : Vol de suite !
                                            </p>
                                            <div className="flex flex-col sm:flex-row gap-3 w-full">
                                                <button onClick={takePot} className="flex-1 py-3.5 px-4 bg-brand-teal hover:bg-brand-tealDark text-white font-extrabold rounded-2xl shadow-md shadow-teal-100 transition-all active:scale-95 text-xs">
                                                    Reprendre ({gameState.potAvailable.score} pts / {gameState.potAvailable.diceLeft} dés)
                                                </button>
                                                <button onClick={rollDices} className="flex-1 py-3.5 px-4 bg-slate-800 hover:bg-slate-700 text-white font-extrabold rounded-2xl shadow-md transition-all active:scale-95 text-xs">
                                                    Nouveau tour (5 dés)
                                                </button>
                                            </div>
                                        </div>
                                    ) : (
                                        <button onClick={rollDices} className="w-full py-4 bg-brand-indigo hover:bg-brand-indigoDark text-white font-extrabold text-base rounded-2xl shadow-xl shadow-indigo-200 transition-all active:scale-95">
                                            Lancer les dés 🎲
                                        </button>
                                    )
                                ) : (
                                    <>
                                        {canTradeFives && (
                                            <button onClick={tradeFivesForOne} className="w-full py-3 px-4 bg-purple-600 hover:bg-purple-700 text-white font-extrabold text-xs rounded-2xl shadow-md shadow-purple-100 transition-all active:scale-95">
                                                🔄 Fusionner : 5+5 ➔ 1 (Libérer 1 dé)
                                            </button>
                                        )}
                                        
                                        <button 
                                            onClick={saveSelection} 
                                            disabled={!valid} 
                                            className={`flex-1 py-4 px-6 font-extrabold text-sm rounded-2xl shadow-lg transition-all active:scale-95 ${
                                                valid 
                                                    ? 'bg-brand-indigo hover:bg-brand-indigoDark text-white shadow-indigo-200' 
                                                    : 'bg-slate-100 text-slate-400 shadow-none cursor-not-allowed border border-slate-200'
                                            }`}
                                        >
                                            {allDicesScoring ? 'Continuer (Main pleine)' : 'Relancer le reste'}
                                        </button>
                                        
                                        <button 
                                            onClick={bankPoints} 
                                            disabled={!valid || isEndingIn50 || allDicesScoring || needsMorePointsToOpen} 
                                            className={`flex-1 py-4 px-6 font-extrabold text-sm rounded-2xl transition-all active:scale-95 ${
                                                valid && !isEndingIn50 && !allDicesScoring && !needsMorePointsToOpen 
                                                    ? 'bg-slate-800 hover:bg-slate-700 text-white shadow-lg' 
                                                    : 'bg-slate-100 text-slate-400 cursor-not-allowed border border-slate-200'
                                            }`}
                                        >
                                            {allDicesScoring ? 'Relance obligatoire !' : (needsMorePointsToOpen ? 'Il faut 500 pour ouvrir' : (isEndingIn50 ? 'Finit par 50 ! (Relance)' : 'Garder'))}
                                        </button>
                                    </>
                                )}
                            </div>
                        )}
                    </div>

                    {/* Footer Controls */}
                    <div className="mt-auto pt-10 flex justify-between items-center text-xs font-semibold text-slate-400 border-t border-slate-200/60">
                        <button onClick={leaveGame} className="hover:text-slate-600 transition-colors">
                            <i className="fas fa-arrow-right-from-bracket mr-1.5"></i>Quitter ma place
                        </button>
                        <button onClick={resetTable} className="hover:text-rose-500 text-rose-400 transition-colors">
                            <i className="fas fa-rotate mr-1.5"></i>Réinitialiser la partie
                        </button>
                    </div>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
